<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Einkauf</title>
    <meta name="description" content="Gemeinsame Einkaufsliste für den Haushalt" />
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0e0f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Einkauf" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./src/styles.css" />
    <style>
      /* Ladebildschirm. Steht hier statt in styles.css, damit er schon beim
         allerersten Zeichnen da ist, bevor CSS und App geladen sind. Farben
         wie --bg / --ink / --accent in styles.css. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #f6f5f2;
        color: #16181a;
        transition: opacity 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        margin-top: -6vh;
      }
      .splash-logo {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        box-shadow: 0 12px 32px rgba(18, 58, 45, 0.22), 0 2px 6px rgba(18, 58, 45, 0.12);
        animation: splash-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .splash-name {
        font: 600 22px/1.2 -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif;
        letter-spacing: -0.02em;
        animation: splash-in 0.6s 0.08s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      /* Ladebalken erst nach kurzer Zeit: bei schnellem Start blitzt nichts auf */
      .splash-bar {
        position: relative;
        width: 64px;
        height: 3px;
        margin-top: 6px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(22, 24, 26, 0.1);
        opacity: 0;
        animation: splash-fade 0.3s 0.6s ease forwards;
      }
      .splash-bar::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        border-radius: 2px;
        background: #1f6b52;
        animation: splash-load 1.1s ease-in-out infinite;
      }
      .splash-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          background: #0d0e0f;
          color: #f2f1ee;
        }
        .splash-logo {
          box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(255, 255, 255, 0.08);
        }
        .splash-bar {
          background: rgba(255, 255, 255, 0.12);
        }
        .splash-bar::after {
          background: #5fbf97;
        }
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.96);
        }
      }
      @keyframes splash-fade {
        to {
          opacity: 1;
        }
      }
      @keyframes splash-load {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo,
        .splash-name,
        .splash-bar::after {
          animation: none;
        }
        .splash-bar {
          animation-duration: 0.01s;
        }
        #splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" data-testid="splash">
      <div class="splash-inner">
        <!-- App-Symbol als SVG (wie scripts/make-icons.mjs), damit nichts nachgeladen werden muss -->
        <svg class="splash-logo" viewBox="0 0 512 512" aria-hidden="true">
          <defs>
            <linearGradient id="splash-g" x1="0" y1="0" x2="0.4" y2="1">
              <stop offset="0" stop-color="#24735a" /><stop offset="1" stop-color="#123a2d" />
            </linearGradient>
            <radialGradient id="splash-l" cx="0.3" cy="0.15" r="0.9">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.16" /><stop offset="0.6" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
          </defs>
          <rect width="512" height="512" fill="url(#splash-g)" />
          <rect width="512" height="512" fill="url(#splash-l)" />
          <g fill="none" stroke="#f6f5f2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M150 196h212l-16 196a28 28 0 0 1-28 26H194a28 28 0 0 1-28-26z" stroke-width="20" />
            <path d="M206 196v-22a50 50 0 0 1 100 0v22" stroke-width="20" />
            <path d="M212 306l32 32 60-64" stroke-width="24" />
          </g>
        </svg>
        <div class="splash-name">Einkauf</div>
        <div class="splash-bar" aria-hidden="true"></div>
        <span class="splash-sr" id="splash-text">…</span>
      </div>
    </div>
    <div id="app" aria-live="polite"></div>
    <script>
      // Vorlesetext des Ladebildschirms in der gespeicherten bzw. Gerätesprache
      (function () {
        var lang = null;
        try {
          lang = localStorage.getItem('pref:lang');
        } catch (e) {}
        if (!lang) lang = (navigator.language || 'en').slice(0, 2);
        document.getElementById('splash-text').textContent =
          lang === 'de' ? 'Lade …' : lang === 'pt' ? 'A carregar …' : 'Loading …';
      })();
    </script>
    <script>
      // Läuft auch, wenn das App-Modul nicht lädt (z. B. ungebaute Dateien
      // ausgeliefert). Statt eines leeren Bildschirms erscheint dann ein Hinweis.
      // Sprache wie in src/i18n.js: gespeicherte Wahl, sonst Gerätesprache.
      setTimeout(function () {
        if (window.__appStarted) return;
        var lang = null;
        try {
          lang = localStorage.getItem('pref:lang');
        } catch (e) {}
        if (!lang) lang = (navigator.language || 'en').slice(0, 2);
        var pt =
          '<div class="center"><h1>A app não arranca</h1><p class="lead">A app não foi carregada. ' +
          'Provavelmente foram publicados os ficheiros de origem em vez do build. ' +
          'Publica a pasta «dist» depois de «npm run build» (ver SETUP.md).</p></div>';
        var splash = document.getElementById('splash');
        if (splash) splash.remove();
        document.getElementById('app').innerHTML =
          lang === 'pt'
            ? pt
            : lang === 'de'
            ? '<div class="center"><h1>App startet nicht</h1><p class="lead">Die App wurde nicht geladen. ' +
              'Wahrscheinlich wurden die Quelldateien statt des Builds veröffentlicht. ' +
              'Veröffentlicht werden muss der Ordner „dist“ nach „npm run build“ (siehe SETUP.md).</p></div>'
            : '<div class="center"><h1>App does not start</h1><p class="lead">The app was not loaded. ' +
              'Probably the source files were published instead of the build. ' +
              'Publish the “dist” folder after “npm run build” (see SETUP.md).</p></div>';
      }, 8000);
    </script>
    <div id="toast" class="toast" role="status" hidden></div>
    <dialog id="sheet" class="sheet"></dialog>
    <dialog id="confirm" class="alert"></dialog>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
