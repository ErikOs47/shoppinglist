<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Einkauf</title>
    <meta name="description" content="Gemeinsame Einkaufsliste für den Haushalt" />
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0e0f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Einkauf" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app" aria-live="polite">
      <div class="center"><p class="lead">…</p></div>
    </div>
    <script>
      // Läuft auch, wenn das App-Modul nicht lädt (z. B. ungebaute Dateien
      // ausgeliefert). Statt eines leeren Bildschirms erscheint dann ein Hinweis.
      // Sprache wie in src/i18n.js: gespeicherte Wahl, sonst Gerätesprache.
      setTimeout(function () {
        if (window.__appStarted) return;
        var lang = null;
        try {
          lang = localStorage.getItem('pref:lang');
        } catch (e) {}
        if (!lang) lang = (navigator.language || 'en').slice(0, 2) === 'de' ? 'de' : 'en';
        document.getElementById('app').innerHTML =
          lang === 'de'
            ? '<div class="center"><h1>App startet nicht</h1><p class="lead">Die App wurde nicht geladen. ' +
              'Wahrscheinlich wurden die Quelldateien statt des Builds veröffentlicht. ' +
              'Veröffentlicht werden muss der Ordner „dist“ nach „npm run build“ (siehe SETUP.md).</p></div>'
            : '<div class="center"><h1>App does not start</h1><p class="lead">The app was not loaded. ' +
              'Probably the source files were published instead of the build. ' +
              'Publish the “dist” folder after “npm run build” (see SETUP.md).</p></div>';
      }, 8000);
    </script>
    <div id="toast" class="toast" role="status" hidden></div>
    <dialog id="sheet" class="sheet"></dialog>
    <dialog id="confirm" class="alert"></dialog>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
