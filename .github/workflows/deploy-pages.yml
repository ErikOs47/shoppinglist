# Baut die App und veröffentlicht den Ordner dist auf GitHub Pages.
# Voraussetzungen (einmalig, siehe SETUP.md Schritt 5):
#   - Settings → Pages → Source: „GitHub Actions“
#   - Settings → Secrets and variables → Actions → Secrets:
#     VITE_SUPABASE_URL und VITE_SUPABASE_ANON_KEY
name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # manuell starten: Actions → Deploy auf GitHub Pages → Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; ein laufendes wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Ohne die Werte würde die App gebaut, zeigt aber nur „Nicht eingerichtet“.
      # Lieber hier mit klarer Meldung abbrechen.
      - name: Supabase-Werte prüfen
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets VITE_SUPABASE_URL und/oder VITE_SUPABASE_ANON_KEY fehlen (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            https://*) ;;
            *) echo "::error::VITE_SUPABASE_URL muss mit https:// beginnen."; exit 1 ;;
          esac

      - run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
